name: MailFlow CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  audit-and-test:
    name: Lint, Audit & Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Verify Sensitive Files Excluded from Git
        run: |
          echo "Scanning Git tracked files for sensitive credentials or environment files..."
          TRACKED_SECRETS=$(git ls-files | grep -E '(\.env$|\.env\.(?!example)[a-zA-Z0-9]+|\.pem$|\.key$|\.cert$|\.p12$|id_rsa)' || true)
          if [ -n "$TRACKED_SECRETS" ]; then
            echo "ERROR: Disallowed sensitive files detected in Git tree!"
            exit 1
          fi
          echo "Verification passed: No sensitive files tracked by Git."

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Backend Regression & Security Test Suites
        working-directory: server
        run: |
          node test_phase3_workspace.js
          node test_phase6_contacts.js
          node test_phase7_email.js
          node test_phase8_campaigns.js
          node test_phase9_scheduling.js
          node test_phase10_autoreply.js
          node test_phase11_analytics.js
          node test_phase12_production.js
          node test_redis_bullmq_integration.js
          node test_transactional_email.js
          node test_security_review.js

      - name: Build Production Frontend
        working-directory: client
        run: npm run build
