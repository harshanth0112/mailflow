services:
  - type: web
    name: mailflow-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: disabled
      - key: RESEND_API_KEY
        sync: false
      - key: SENDLIBERTY_API_KEY
        sync: false
      - key: SENDLIBERTY_FROM_EMAIL
        sync: false
      - key: CAMPAIGN_EMAIL_PROVIDER
        value: mailbox
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: MailFlow
      - key: COOKIE_SAME_SITE
        value: none
      - key: QUEUE_FEATURES_ENABLED
        value: false
